services:
  - type: web
    name: drug-tariff-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      # Free plans have no persistent disk, so uploaded data resets on every redeploy or restart.
      # On a paid plan, add a disk below and set DATA_DIR to its mount path to keep the data.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: tariff-data
    #   mountPath: /var/data
    #   sizeGB: 1
